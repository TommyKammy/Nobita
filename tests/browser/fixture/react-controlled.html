<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Controlled React editor</title></head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { useState } from 'react';
      import { createRoot } from 'react-dom/client';
      import { NobitaEditor } from '../../../packages/react/src/index.ts';
      import { createBlock, createDoc } from '@nobita/core';

      import * as Y from 'yjs';
      import { YjsCollaborationAdapter } from '../../../packages/collab-yjs/src/index.ts';

      function NavigatingEditor() {
        const [props, setProps] = useState(() => {
          const doc = createDoc({ blocks: [createBlock('paragraph', { text: 'First' })] });
          return { doc, collaboration: new YjsCollaborationAdapter(new Y.Doc(), doc) };
        });
        window.navigate = (shared) => {
          const doc = createDoc({ blocks: [createBlock('paragraph', { text: 'Second' })] });
          const collaboration = shared ? new YjsCollaborationAdapter(new Y.Doc(), doc) : null;
          window.oldAdapter = props.collaboration;
          window.newAdapter = collaboration;
          setProps({ doc, collaboration });
        };
        return React.createElement(NobitaEditor, props);
      }

      function ControlledEditor() {
        const [doc, setDoc] = useState(() => createDoc({
          blocks: [createBlock('paragraph', { id: 'controlled', text: 'Alpha' })],
        }));
        return React.createElement(NobitaEditor, {
          doc,
          onChange(next, meta) {
            window.sources.push(meta.source);
            if (window.sources.length < 5) setDoc(next);
          },
        });
      }
      window.sources = [];
      createRoot(document.getElementById('root')).render(React.createElement(location.search ? NavigatingEditor : ControlledEditor));
    </script>
  </body>
</html>
